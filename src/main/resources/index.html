<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connection Monitor</title>
  <style>
    body {
      background-color: #121212;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #00bcd4;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    select {
      background-color: #1e1e1e;
      color: #f5f5f5;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 4px;
    }

    table {
      width: 80%;
      margin: 0 auto 40px auto;
      border-collapse: collapse;
      background-color: #1e1e1e;
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #333;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #2c2c2c;
      color: #00bcd4;
    }

    .status-circle {
      height: 14px;
      width: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-up {
      background-color: #4caf50;
    }

    .status-down {
      background-color: #f44336;
    }

    .status-unknown {
      background-color: #767676;
    }
    
  </style>
</head>
<body>
  <h1>Connection Monitor</h1>

  <div class="controls">
    <select id="appSelect">
      <option value="">Select App</option>
      <option value="FXOMS">FXOMS</option>
    </select>

    <select id="envSelect">
      <option value="">Select Environment</option>
      <option value="DEV">DEV</option>
      <option value="SIT">SIT</option>
      <option value="UAT">UAT</option>
    </select>
  </div>

  <table id="statusTable">
    <thead>
      <tr>
        <th>Connection Status</th>
        <th>Interface ID</th>
        <th>Error Message</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be added dynamically -->
    </tbody>
  </table>

  <script>
    // Replace with your WebSocket server URL
    const ws = new WebSocket("ws://localhost:8080/status");

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      // Expected structure: { interfaceId: "id1", connectionStatus: "UP"|"DOWN", errorMessage: "msg" }

      //Expected structure: { applicationId: "FXOMS", "interfaceId: "FIX Credit Adapter", state: "CONNECTED", errorMessage: "msg" }

      updateTable(data);
    };

    function updateTable(data) {
      const tbody = document.querySelector("#statusTable tbody");

      let row = document.getElementById(data.interfaceId);
      const statusClass = data.connectionStatus === "CONNECTED" ? "status-up" : (data.connectionStatus === "DISCONNECTED" ? "status-down": "status-unknown");
      const errorMessage = data.errorMessage && data.errorMessage.trim() !== "" ? data.errorMessage : "-";

      if (!row) {
        // Create new row
        row = document.createElement("tr");
        row.id = data.interfaceId;

        row.innerHTML = `
          <td><span class="status-circle ${statusClass}"></span></td>
          <td>${data.interfaceId}</td>
          <td>${errorMessage}</td>
        `;

        tbody.appendChild(row);
      } else {
        // Update existing row
        row.cells[0].innerHTML = `<span class="status-circle ${statusClass}"></span>`;
        row.cells[2].textContent = errorMessage;
      }
    }

    // Demo mode (simulate messages every 2s if no backend running)
    ws.onerror = () => {
      console.log("WebSocket not available, running in demo mode...");
      setInterval(() => {
        const demoData = {
          interfaceId: "if" + (Math.floor(Math.random() * 3) + 1),
          connectionStatus: Math.random() > 0.5 ? "UP" : "DOWN",
          errorMessage: Math.random() > 0.7 ? "Timeout error" : null
        };
        updateTable(demoData);
      }, 2000);
    };
  </script>
</body>
</html>
